name: News Bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # كل ١٥ دقيقة، بعيد عن رأس الساعة لأن GitHub يتأخر وقت الزحمة
  workflow_dispatch:          # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ما يشتغل لين تحط التوكن في Secrets (عشان ما يطلع لك فشل كل ١٥ دقيقة)
    if: ${{ vars.CHAT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SUPABASE_URL: https://wbkkmkesgsegtwvyzgtv.supabase.co
          CHAT_ID: ${{ vars.CHAT_ID }}
          BRAND: ${{ vars.BRAND || '@hamoudgpt' }}
          INSTAGRAM: ${{ vars.INSTAGRAM || 'hamoudgpt' }}
          SPONSOR_TEXT: ${{ vars.SPONSOR_TEXT }}
          SPONSOR_EVERY: ${{ vars.SPONSOR_EVERY }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_HASHTAGS: ${{ vars.IG_HASHTAGS }}
          IG_MAX_PER_DAY: ${{ vars.IG_MAX_PER_DAY }}
          IG_MIN_GAP_MINUTES: ${{ vars.IG_MIN_GAP_MINUTES }}
