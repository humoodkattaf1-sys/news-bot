name: News Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # كل ١٥ دقيقة (GitHub أحياناً يتأخر شوي)
  workflow_dispatch:          # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: https://wbkkmkesgsegtwvyzgtv.supabase.co
          CHAT_ID: ${{ vars.CHAT_ID }}
          BRAND: ${{ vars.BRAND }}
          SPONSOR_TEXT: ${{ vars.SPONSOR_TEXT }}
          SPONSOR_EVERY: ${{ vars.SPONSOR_EVERY }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_HASHTAGS: ${{ vars.IG_HASHTAGS }}
          IG_MAX_PER_DAY: ${{ vars.IG_MAX_PER_DAY }}
          IG_MIN_GAP_MINUTES: ${{ vars.IG_MIN_GAP_MINUTES }}
